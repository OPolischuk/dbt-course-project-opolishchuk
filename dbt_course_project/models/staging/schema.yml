version: 2

models:
  - name: stg_interviews
    description: "Staging model for interviews with full history preservation."
    tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns:
              - interview_id
              - updated_at
    columns:
      - name: status
        tests:
          - accepted_values:
              arguments:
                values: ['SCHEDULED', 'IN_PROGRESS', 'PENDING_FEEDBACK', 'COMPLETED', 'CANCELLED', 'REQUESTED', 'DRAFT']

      - name: run_type
        tests:
          - dbt_expectations.expect_column_values_to_match_regex:
              arguments:
                regex: '^(online|offline|ONLINE|OFFLINE)$'

      - name: interview_type
        tests:
          - accepted_values:
              arguments:
                values: ['Technical', 'Project']

  - name: stg_candidates
    description: "Staging model for candidates with full history preservation."
    tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns:
              - candidate_id
              - updated_at
    columns:
      - name: english_level
        tests:
          - dbt_utils.not_empty_string:
              arguments: {}

  - name: stg_job_functions
    description: "Staging model for job functions with uniqueness check on ID and timestamp."
    tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns:
              - job_function_id
              - updated_at
    columns:
      - name: job_function_id
        tests:
          - dbt_expectations.expect_column_value_lengths_to_equal:
              arguments:
                value: 19

  - name: stg_skills
    description: "Staging model for skills reference data."
    columns:
      - name: skill_id
        tests:
          - dbt_expectations.expect_column_value_lengths_to_equal:
              arguments:
                value: 19
